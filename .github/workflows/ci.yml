name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  server:
    name: Go server (fmt, vet, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  plugin:
    name: Construct 3 plugin (ACE + behaviour on a WebSocket stub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/plugin-mock-test.js
      - name: Build the addon
        run: |
          pwsh -NoProfile -File tools/build-addon.ps1
          unzip -l dist/starkflow.c3addon | grep -q 'addon.json'


  protocol:
    name: Live protocol smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the server
        run: cd server && go build -o "$RUNNER_TEMP/starkflow" ./cmd/starkflow
      - name: Start the server and run the smoke test
        env:
          SF_BASE: http://127.0.0.1:8099
          SF_WS: ws://127.0.0.1:8099/ws
        run: |
          STARKFLOW_ADDR=:8099 STARKFLOW_SECRET=ci "$RUNNER_TEMP/starkflow" &
          sleep 1
          node tests/server-smoke.mjs

  cluster:
    name: Live cluster (directory + two regions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the server
        run: cd server && go build -o "$RUNNER_TEMP/starkflow" ./cmd/starkflow
      - name: Start a directory and two nodes in two regions, then check the cluster
        run: |
          STARKFLOW_MODE=directory STARKFLOW_ADDR=:8097 STARKFLOW_CLUSTER_SECRET=ci STARKFLOW_ADMIN_TOKEN=ci "$RUNNER_TEMP/starkflow" &
          STARKFLOW_ADDR=:8098 STARKFLOW_CLUSTER_SECRET=ci STARKFLOW_REGION=eu \
            STARKFLOW_PUBLIC_URL=ws://127.0.0.1:8098/ws STARKFLOW_DIRECTORY_URL=http://127.0.0.1:8097 "$RUNNER_TEMP/starkflow" &
          STARKFLOW_ADDR=:8099 STARKFLOW_CLUSTER_SECRET=ci STARKFLOW_REGION=ru \
            STARKFLOW_PUBLIC_URL=ws://127.0.0.1:8099/ws STARKFLOW_DIRECTORY_URL=http://127.0.0.1:8097 "$RUNNER_TEMP/starkflow" &
          sleep 7
          node tests/cluster-e2e.mjs

  docker:
    name: Docker image + smoke test inside the container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the compose files
        env:
          STARKFLOW_SECRET: ci
          SF_DOMAIN: game.example.com
          CF_TUNNEL_TOKEN: ci
        run: |
          docker compose config -q
          docker compose -f docker-compose.tls.yml --profile caddy --profile cfdomain config -q

      - name: Build the image
        run: docker build -t starkflow:ci .
      - name: Run the container
        run: docker run -d --name starkflow -p 8099:8080 -e STARKFLOW_SECRET=ci starkflow:ci
      - name: Wait for the health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8099/health; then exit 0; fi
            sleep 1
          done
          echo "server did not start"; docker logs starkflow; exit 1
      - name: Smoke test against the container
        env:
          SF_BASE: http://127.0.0.1:8099
          SF_WS: ws://127.0.0.1:8099/ws
        run: node tests/server-smoke.mjs
      - name: Check the PORT variable and the healthcheck (hosting platforms pass the port this way)
        run: |
          docker run -d --name starkflow-port -p 8098:3000 -e PORT=3000 -e STARKFLOW_SECRET=ci starkflow:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8098/health; then break; fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:8098/health; then docker logs starkflow-port; docker rm -f starkflow-port; exit 1; fi
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' starkflow-port)
            if [ "$status" = healthy ]; then echo "healthcheck reports healthy"; docker rm -f starkflow-port; exit 0; fi
            sleep 3
          done
          docker logs starkflow-port; docker rm -f starkflow-port; echo "healthcheck never reported healthy"; exit 1


      - name: Entrypoint with a tunnel token (cloudflared must not block the server)
        run: |
          docker run -d --name starkflow-tunnel -p 8096:3000 -e PORT=3000 -e STARKFLOW_SECRET=ci -e CF_TUNNEL_TOKEN=dummy starkflow:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8096/health; then docker rm -f starkflow-tunnel; exit 0; fi
            sleep 1
          done
          docker logs starkflow-tunnel; docker rm -f starkflow-tunnel; exit 1

      - name: Container logs
        if: always()
        run: docker logs starkflow


  installer:
    name: Installer script (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning install.sh
