  <circle cx="1090" cy="70" r="150" fill="#58a6ff" fill-opacity="0.07"/>

  <g stroke="#58a6ff" stroke-opacity="0.4" stroke-width="2" fill="none">
    <path d="M934 132 L1072 98"/>
    <path d="M934 132 L1006 216"/>
