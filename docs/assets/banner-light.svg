    <circle cx="1182" cy="166" r="9"/>
  </g>

  <text x="80" y="152" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="88" font-weight="700" letter-spacing="-2" fill="#0b1d33">StarkFlow</text>
