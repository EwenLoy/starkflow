  <circle cx="1090" cy="70" r="150" fill="#0969da" fill-opacity="0.06"/>

  <g stroke="#0969da" stroke-opacity="0.35" stroke-width="2" fill="none">
    <path d="M934 132 L1072 98"/>
    <path d="M934 132 L1006 216"/>
    <path d="M1072 98 L1182 166"/>
    <path d="M1006 216 L1182 166"/>
    <path d="M934 132 L1182 166"/>
  </g>
  <g fill="none" stroke="#0969da" stroke-opacity="0.22" stroke-width="1.5">
    <circle cx="934" cy="132" r="21"/>
    <circle cx="1072" cy="98" r="21"/>
    <circle cx="1006" cy="216" r="21"/>
    <circle cx="1182" cy="166" r="21"/>
