  <text x="82" y="243" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16" letter-spacing="3.2" fill="#6b7280">SELF-HOSTED · ONE GO BINARY · WEBSOCKET</text>
